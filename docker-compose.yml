services:
  nook:
    build:
      context: .
    container_name: nook
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__NookDb: "Server=nook-db,1433;Database=Nook;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
      GoogleCalendar__IcalUrl: "${GOOGLE_CALENDAR_ICAL_URL}"
    depends_on:
      - nook-db

  nook-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nook-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
    volumes:
      - nook-sql:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup

volumes:
  nook-sql: