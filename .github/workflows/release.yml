name: Nook Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chanter08/nook

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

          

  deploy:
    name: Deploy Home Server
    needs: release
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Synchronize Docker Compose
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          NOOK_DEPLOY_PATH: ${{ vars.NOOK_DEPLOY_PATH }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:NOOK_DEPLOY_PATH)) {
            throw "NOOK_DEPLOY_PATH variable is not configured."
          }
          $target = Join-Path $env:NOOK_DEPLOY_PATH "docker-compose.yml"
          $envFile = Join-Path $env:NOOK_DEPLOY_PATH ".env"
          if (!(Test-Path $target) -or !(Test-Path $envFile)) {
            throw "Server docker-compose.yml or .env not found."
          }
          Copy-Item $target "$target.bak" -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "docker-compose.yml") $target -Force

      - name: Check home server Docker
        shell: cmd
        env:
          NOOK_DEPLOY_PATH: ${{ vars.NOOK_DEPLOY_PATH }}
        run: |
          whoami
          cd /d "%NOOK_DEPLOY_PATH%"
          echo === Files ===
          dir
          echo === Docker engine ===
          docker version
          docker info
          echo === Compose config ===
          docker compose --env-file .env -f docker-compose.yml config --services
          echo === Pull test ===
          docker compose --env-file .env -f docker-compose.yml pull nook
          
      - name: Apply pending database migrations
        shell: cmd
        env:
          NOOK_DEPLOY_PATH: ${{ vars.NOOK_DEPLOY_PATH }}
        run: |
          cd /d "%NOOK_DEPLOY_PATH%"
          docker compose --env-file .env -f docker-compose.yml run --rm --no-deps nook --migrate

      - name: Deploy Nook
        shell: cmd
        env:
          NOOK_DEPLOY_PATH: ${{ vars.NOOK_DEPLOY_PATH }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%NOOK_DEPLOY_PATH%\deploy.ps1"
