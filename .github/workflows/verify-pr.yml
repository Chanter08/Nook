name: Verify Nook pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Build React application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    name: Build .NET API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet build server/Nook.Api/Nook.Api.csproj -c Release
      - name: Verify EF Core migration snapshot
        run: dotnet run --project server/Nook.Api/Nook.Api.csproj -c Release --no-build -- --verify-migrations
        env:
          ConnectionStrings__NookDb: "Server=localhost;Database=NookMigrationValidation;User Id=sa;Password=NotARealPassword123!;Encrypt=False"